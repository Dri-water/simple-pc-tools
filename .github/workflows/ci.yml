name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: UI scripts parse
        shell: pwsh
        run: Get-ChildItem ui\js\*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Test (includes the UI design rules in tests/ui_design.rs)
        run: cargo test --workspace
      - name: Fast scan of a real drive (GitHub's runners are administrators)
        run: cargo test -p disk-scan -- --ignored --nocapture real_volume
      - name: Fast scan vs folder walk, side by side
        run: cargo run --release -p disk-scan --example scan -- C:\Windows

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0 installer\simple-pc-tools.iss
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $setup = Get-Item target\installer\simple-pc-tools-setup-*.exe
          # Wait for the installer only (-Wait would also wait for the app it starts).
          (Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/COMPONENTS="core,apps"','/TASKS="autostart"' -PassThru).WaitForExit()
          $exe = "${env:ProgramFiles}\Simple PC Tools\simple-pc-tools.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          $task = Get-ScheduledTask -TaskName 'Simple PC Tools'
          if ($task.Principal.RunLevel -ne 'Highest') { throw "sign-in task isn't elevated" }
          $settings = Get-Content "$env:LOCALAPPDATA\Simple PC Tools\settings.json" | ConvertFrom-Json
          if (-not $settings.tools.apps -or $settings.tools.disk -or $settings.tools.resources) { throw "tool choice not saved: $($settings.tools)" }
          $uninstaller = Get-Item "${env:ProgramFiles}\Simple PC Tools\unins*.exe"
          if (-not (Get-Process simple-pc-tools -ErrorAction SilentlyContinue)) { Write-Warning "app isn't running after install (no desktop session on the runner?)" }
          (Start-Process $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          Start-Sleep 5
          if (Get-Process simple-pc-tools -ErrorAction SilentlyContinue) { throw "app still running after uninstall" }
          if (Get-ScheduledTask -TaskName 'Simple PC Tools' -ErrorAction SilentlyContinue) { throw "sign-in task left behind" }
          if (Test-Path $exe) { throw "exe left behind" }
          "install and uninstall OK"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/*.exe
