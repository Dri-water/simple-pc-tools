name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes the UI design rules in tests/ui_design.rs)
        run: cargo test --workspace
      - name: Fast scan of a real drive (GitHub's runners are administrators)
        run: cargo test -p disk-scan -- --ignored --nocapture real_volume
      - name: Fast scan vs folder walk, side by side
        run: cargo run --release -p disk-scan --example scan -- C:\Windows
