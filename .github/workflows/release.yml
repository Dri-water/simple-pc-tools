name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build the
# installer and a portable zip and publish them as a GitHub release. The app's
# update check reads that release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\simple-pc-tools.iss

      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $out = "target\installer"
          Compress-Archive -Path target\release\simple-pc-tools.exe, LICENSE -DestinationPath "$out\simple-pc-tools-$env:VERSION-portable.zip"
          Get-ChildItem $out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Out-File "$out\SHA256SUMS.txt" -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" target\installer\* --title "Simple PC Tools $env:VERSION" --generate-notes
