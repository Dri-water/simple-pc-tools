name: Something isn't working
description: Report a problem
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → Updates shows it.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: The end of %LOCALAPPDATA%\Simple PC Tools\simple-pc-tools.log. Check it for anything private before pasting.
      render: text
