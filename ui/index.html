<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple PC Tools</title>
<link rel="icon" href="/icon.png">
<style>
/* Design system: see DESIGN.md. Colours, type sizes and families only as tokens. */
:root {
  /* TOKENS:BEGIN */
  --bg: #ffffff;
  --side: #f6f7f9;
  --surface: #ffffff;
  --sunken: #f3f4f6;
  --hover: #f0f2f5;
  --line: #e5e7eb;
  --line-strong: #d1d5db;
  --fg: #1a1c1f;
  --muted: #5f6670;
  --faint: #8b929b;
  --accent: #165cd6;
  --accent-hover: #0f4cb8;
  --accent-soft: #e8f0fd;
  --on-accent: #ffffff;
  --ok: #18804a;      --ok-soft: #e7f5ed;
  --warn: #a86400;    --warn-soft: #fdf3e2;
  --bad: #c4312b;     --bad-soft: #fcebea;
  --info: #165cd6;    --info-soft: #e8f0fd;
  --idle: #7b828c;    --idle-soft: #f0f1f3;
  --bar: #165cd6;
  --bar-track: #eceef1;
  --shadow: 0 1px 2px #0000000d, 0 4px 16px #0000000f;
  --scrim: #00000059;
  --focus: #165cd6;

  --font-text: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-data: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --step--1: 12px;
  --step-0: 14px;
  --step-1: 16px;
  --step-2: 20px;
  --step-3: 28px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-pill: 999px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202020;
    --side: #1b1b1b;
    --surface: #2b2b2b;
    --sunken: #252525;
    --hover: #333333;
    --line: #3a3a3a;
    --line-strong: #4a4a4a;
    --fg: #ececec;
    --muted: #a8a8a8;
    --faint: #7c7c7c;
    --accent: #6ea8ff;
    --accent-hover: #8fbcff;
    --accent-soft: #24324a;
    --on-accent: #0d1a2e;
    --ok: #5fd08f;      --ok-soft: #1e3328;
    --warn: #f0b45a;    --warn-soft: #3a2f1c;
    --bad: #ff7a72;     --bad-soft: #3d2423;
    --info: #6ea8ff;    --info-soft: #24324a;
    --idle: #9a9a9a;    --idle-soft: #333333;
    --bar: #6ea8ff;
    --bar-track: #3a3a3a;
    --shadow: 0 1px 2px #00000066, 0 4px 16px #00000066;
    --scrim: #00000099;
    --focus: #6ea8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202020;
  --side: #1b1b1b;
  --surface: #2b2b2b;
  --sunken: #252525;
  --hover: #333333;
  --line: #3a3a3a;
  --line-strong: #4a4a4a;
  --fg: #ececec;
  --muted: #a8a8a8;
  --faint: #7c7c7c;
  --accent: #6ea8ff;
  --accent-hover: #8fbcff;
  --accent-soft: #24324a;
  --on-accent: #0d1a2e;
  --ok: #5fd08f;      --ok-soft: #1e3328;
  --warn: #f0b45a;    --warn-soft: #3a2f1c;
  --bad: #ff7a72;     --bad-soft: #3d2423;
  --info: #6ea8ff;    --info-soft: #24324a;
  --idle: #9a9a9a;    --idle-soft: #333333;
  --bar: #6ea8ff;
  --bar-track: #3a3a3a;
  --shadow: 0 1px 2px #00000066, 0 4px 16px #00000066;
  --scrim: #00000099;
  --focus: #6ea8ff;
  color-scheme: dark;
}
/* TOKENS:END */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-text); font-size: var(--step-0); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-sm); }
svg.i { width: 16px; height: 16px; flex: none; }
.data { font-family: var(--font-data); font-size: var(--step--1); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
[hidden] { display: none !important; }
.sprite { position: absolute; }

/* ---------- shell: sidebar + main ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--side); border-right: 1px solid var(--line);
  padding: var(--s5) var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s5);
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2); }
.brand img { width: 28px; height: 28px; }
.brand b { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3);
  border-radius: var(--r-md); color: var(--fg); position: relative;
}
.nav a:hover { background: var(--hover); text-decoration: none; }
.nav a[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.nav a[aria-current="page"]::before {
  content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px;
  border-radius: var(--r-pill); background: var(--accent);
}
.nav .count {
  margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: var(--r-pill);
  background: var(--bad); color: var(--on-accent); font-size: var(--step--1); text-align: center; font-weight: 600;
}
.side-foot { margin-top: auto; padding: 0 var(--s2); color: var(--faint); font-size: var(--step--1); }

main { padding: var(--s6) max(var(--s4), 4vw) var(--s6); min-width: 0; }
.page { max-width: 920px; margin: 0 auto; }
.head { display: flex; align-items: flex-start; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s5); }
.head .titles { flex: 1 1 280px; min-width: 0; }
h1 {
  font-family: var(--font-display); font-size: var(--step-3); font-weight: 600;
  line-height: 1.2; margin: 0 0 var(--s1); letter-spacing: -0.01em; text-wrap: balance;
}
h2 { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; margin: 0 0 var(--s3); }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }
.actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: var(--s2); height: 32px; padding: 0 var(--s3);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: var(--surface);
  cursor: pointer; white-space: nowrap; transition: background .12s var(--ease), border-color .12s var(--ease);
}
a.btn { color: var(--fg); }
a.btn:hover { text-decoration: none; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }

/* ---------- switch ---------- */
.switch { display: inline-flex; align-items: center; gap: var(--s2); cursor: pointer; user-select: none; position: relative; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track {
  width: 40px; height: 20px; border-radius: var(--r-pill); border: 1px solid var(--line-strong);
  background: var(--sunken); position: relative; flex: none; transition: background .15s var(--ease);
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--muted); transition: transform .15s var(--ease), background .15s var(--ease);
}
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(20px); background: var(--on-accent); }
.switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .5; }

/* ---------- banner ---------- */
.banner {
  display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s3) var(--s4);
  border-radius: var(--r-lg); margin-bottom: var(--s4); border: 1px solid var(--line);
  background: var(--info-soft);
}
.banner .grow { flex: 1 1 240px; min-width: 0; }
.banner.warn { background: var(--warn-soft); }
.banner.bad { background: var(--bad-soft); }
.banner > svg { color: var(--info); }
.banner.warn > svg { color: var(--warn); }
.banner.bad > svg { color: var(--bad); }
.banner .meter { margin-top: var(--s2); }

/* ---------- card, rows ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.section h2 { margin-top: var(--s5); }
.row {
  display: flex; align-items: center; gap: var(--s4); padding: var(--s4); flex-wrap: wrap;
}
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1 1 240px; min-width: 0; }
.row .label { font-weight: 600; }
.row .desc { color: var(--muted); font-size: var(--step--1); overflow-wrap: anywhere; }

/* ---------- status: lamp, pill ---------- */
.lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 3px var(--c-soft); }
.lamp.live { animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--c-soft); } }
.pill {
  display: inline-flex; align-items: center; padding: 0 var(--s2); height: 22px; border-radius: var(--r-pill);
  background: var(--c-soft); color: var(--c); font-size: var(--step--1); font-weight: 600; white-space: nowrap;
}
.st-healthy { --c: var(--ok); --c-soft: var(--ok-soft); }
.st-starting, .st-acting { --c: var(--info); --c-soft: var(--info-soft); }
.st-failing, .st-gave_up { --c: var(--bad); --c-soft: var(--bad-soft); }
.st-held { --c: var(--warn); --c-soft: var(--warn-soft); }
.st-stopped, .st-unknown { --c: var(--idle); --c-soft: var(--idle-soft); }

/* ---------- apps ---------- */
.summary { display: flex; gap: var(--s4); flex-wrap: wrap; align-items: center; color: var(--muted); margin-bottom: var(--s3); }
.summary b { color: var(--fg); }
.summary .dot { display: inline-flex; align-items: center; gap: var(--s2); }
.app { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s2) var(--s4); padding: var(--s4); align-items: start; }
.app + .app { border-top: 1px solid var(--line); }
.app.attn { box-shadow: inset 3px 0 0 var(--c); }
.app:first-child.attn { border-top-left-radius: var(--r-lg); }
.app:last-child.attn { border-bottom-left-radius: var(--r-lg); }
.app .lamp { margin-top: 6px; }
.app-main { min-width: 0; }
.app-name { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.app-name b { font-size: var(--step-1); font-weight: 600; }
.app-prog { color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-note { color: var(--muted); font-size: var(--step--1); margin-top: var(--s1); }
.app-ctrl { display: flex; flex-direction: column; gap: var(--s2); align-items: flex-end; }
.app-ctrl .switches { display: flex; gap: var(--s4); flex-wrap: wrap; justify-content: flex-end; }
.app-ctrl .buttons { display: flex; gap: var(--s1); }
.probes { display: flex; gap: var(--s1); flex-wrap: wrap; margin-top: var(--s2); }
.probe {
  display: inline-flex; align-items: center; gap: var(--s1); padding: 2px var(--s2); border-radius: var(--r-sm);
  font-family: var(--font-data); font-size: var(--step--1); background: var(--sunken); color: var(--muted);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.probe.ok svg { color: var(--ok); }
.probe.bad { background: var(--bad-soft); color: var(--bad); }
.events { grid-column: 2 / -1; margin: var(--s2) 0 0; padding: var(--s2) var(--s3); list-style: none; background: var(--sunken); border-radius: var(--r-md); max-height: 220px; overflow: auto; }
.events li { display: flex; gap: var(--s3); padding: 2px 0; font-size: var(--step--1); }
.events time { color: var(--faint); font-family: var(--font-data); flex: none; }
.empty { text-align: center; padding: var(--s6) var(--s4); }
.empty .art { color: var(--accent); width: 40px; height: 40px; margin-bottom: var(--s3); }
.empty p { color: var(--muted); max-width: 46ch; margin: var(--s2) auto var(--s4); }
.after-list { margin-top: var(--s4); }

/* ---------- disk ---------- */
.drives { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
.drive { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2); }
.drive .top { display: flex; justify-content: space-between; gap: var(--s2); align-items: baseline; }
.meter { height: 6px; border-radius: var(--r-pill); background: var(--bar-track); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--bar); border-radius: var(--r-pill); }
.meter.full > i { background: var(--bad); }
.scan-state { padding: var(--s4); display: flex; gap: var(--s4); align-items: center; flex-wrap: wrap; }
.scan-state .grow { flex: 1 1 200px; min-width: 0; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(1turn); } }
.scan-note { margin-bottom: var(--s2); }
.crumbs { display: flex; flex-wrap: wrap; gap: var(--s1); align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
.crumbs button { border: 0; background: none; padding: 2px var(--s1); border-radius: var(--r-sm); cursor: pointer; color: var(--accent); }
.crumbs button:hover { background: var(--hover); }
.crumbs button[aria-current] { color: var(--fg); font-weight: 600; cursor: default; }
.crumbs svg { color: var(--faint); width: 12px; height: 12px; }
.crumbs .total { margin-left: auto; color: var(--faint); }
.table-wrap { overflow-x: auto; }
.items { width: 100%; border-collapse: collapse; table-layout: fixed; }
.items th { text-align: left; font-weight: 600; color: var(--muted); font-size: var(--step--1); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); }
.items td { padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); vertical-align: middle; }
.items tr:last-child td { border-bottom: 0; }
.items tbody tr:hover { background: var(--hover); }
.items .num { text-align: right; font-family: var(--font-data); font-size: var(--step--1); white-space: nowrap; }
.items .c-share { width: 26%; }
.items .c-size { width: 13%; }
.items .c-files { width: 12%; }
.items .c-act { width: 56px; }
.item-name { display: flex; align-items: center; gap: var(--s2); min-width: 0; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; width: 100%; }
.item-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-name svg { color: var(--muted); }
.item-name.dir svg { color: var(--accent); }
.item-name:not([data-node]) { cursor: default; }
.share { display: flex; align-items: center; gap: var(--s2); }
.share .meter { flex: 1; }
.share span { width: 44px; text-align: right; font-family: var(--font-data); font-size: var(--step--1); color: var(--muted); }

/* ---------- segmented ---------- */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 var(--s3); height: 30px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ---------- dialog (app editor) ---------- */
dialog.sheet {
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 0; background: var(--surface); color: var(--fg);
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: var(--shadow);
}
dialog.sheet::backdrop { background: var(--scrim); }
.sheet form { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.sheet header, .sheet footer { padding: var(--s4) var(--s5); display: flex; align-items: center; gap: var(--s3); }
.sheet header { border-bottom: 1px solid var(--line); }
.sheet header h2 { margin: 0; flex: 1; font-size: var(--step-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet footer { border-top: 1px solid var(--line); flex-wrap: wrap; }
.sheet footer .grow { flex: 1; }
.sheet .body { padding: var(--s4) var(--s5); overflow: auto; display: flex; flex-direction: column; gap: var(--s4); }
.field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.field > span { font-weight: 600; }
.field small, .hint { color: var(--muted); font-size: var(--step--1); }
.input, .field input:not([type=checkbox]), .field select, .field textarea {
  height: 32px; padding: 0 var(--s3); border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--bg); min-width: 0; width: 100%;
}
.field textarea { height: auto; padding: var(--s2) var(--s3); font-family: var(--font-data); font-size: var(--step--1); resize: vertical; }
.input-row { display: flex; gap: var(--s2); min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); }
details.adv { border: 1px solid var(--line); border-radius: var(--r-md); }
details.adv > summary { cursor: pointer; padding: var(--s3) var(--s4); font-weight: 600; list-style: none; display: flex; align-items: center; gap: var(--s2); }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary svg { transition: transform .15s var(--ease); }
details.adv[open] > summary svg { transform: rotate(90deg); }
details.adv > .inner { padding: 0 var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.checks { display: flex; flex-direction: column; gap: var(--s2); }
.check-row { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: var(--s2); align-items: center; }
.form-error { color: var(--bad); background: var(--bad-soft); border-radius: var(--r-md); padding: var(--s2) var(--s3); }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: var(--s5); transform: translate(-50%, 16px); opacity: 0;
  background: var(--fg); color: var(--bg); padding: var(--s2) var(--s4); border-radius: var(--r-md);
  box-shadow: var(--shadow); transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none;
  max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- narrow ---------- */
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: var(--s2) var(--s3); gap: var(--s3); border-right: 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand b, .side-foot { display: none; }
  .nav { flex-direction: row; flex-wrap: wrap; }
  .nav a[aria-current="page"]::before { display: none; }
  main { padding: var(--s5) var(--s4); }
  .app { grid-template-columns: auto minmax(0, 1fr); }
  .app-ctrl { grid-column: 2; align-items: flex-start; }
  .app-ctrl .switches { justify-content: flex-start; }
  .events { grid-column: 1 / -1; }
  .items .c-files, .items td:nth-child(4), .items th:nth-child(4) { display: none; }
  .items .c-share { width: 30%; }
  .items .c-size { width: 22%; }
}
@media (max-width: 460px) {
  .nav a span.lbl { display: none; }
  .share span { display: none; }
  .check-row { grid-template-columns: 1fr auto; }
  .check-row > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .items td, .items th { padding-left: var(--s2); padding-right: var(--s2); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

  <defs>

<div class="shell">
  <aside class="side">
    <div class="brand"><img src="/icon.png" alt=""><b>Simple PC Tools</b></div>
    <nav class="nav" id="nav">
      <a href="#apps" data-tool="apps"><svg class="i"><use href="#i-apps"/></svg><span class="lbl">Apps</span><span class="count" id="nav-apps-count" hidden></span></a>
      <a href="#disk" data-tool="disk"><svg class="i"><use href="#i-disk"/></svg><span class="lbl">Disk usage</span></a>
      <a href="#settings"><svg class="i"><use href="#i-settings"/></svg><span class="lbl">Settings</span></a>
    </nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main>
    <div class="page">
      <div id="update-banner"></div>
      <section id="page-apps" hidden></section>
      <section id="page-disk" hidden></section>
      <section id="page-settings" hidden></section>
    </div>
  </main>
</div>

<dialog class="sheet" id="editor" aria-labelledby="editor-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const DEMO = new URLSearchParams(location.search).has('demo');
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (name, cls = 'i') => `<svg class="${cls}"><use href="#i-${name}"/></svg>`;
const now = () => Math.floor(Date.now() / 1000);

// ---------- formatting ----------
function bytes(n) {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
  const i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
  const v = n / 1024 ** i;
  return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)} ${u[i]}`;
}
const count = n => Number(n || 0).toLocaleString();
function ago(t) {
  if (!t) return 'never';
  const s = now() - t;
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return new Date(t * 1000).toLocaleDateString();
}
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

// ---------- toast ----------
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

// ---------- api ----------
async function api(method, path, body) {
  if (DEMO) return demoApi(method, path, body);
  const res = await fetch(path, {
    method,
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 204 || res.status === 202) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `Something went wrong (${res.status}).`);
  return data;
}

// Two-step confirmation for destructive buttons: the first click arms, the second acts.
const armed = new Map();
function confirmClick(btn, label, act) {
  const key = btn.dataset.confirm;
  if (armed.has(key)) {
    clearTimeout(armed.get(key));
    armed.delete(key);
    act();
    return;
  }
  const old = btn.innerHTML;
  btn.classList.add('danger');
  btn.classList.remove('icon');
  btn.innerHTML = esc(label);
  armed.set(key, setTimeout(() => {
    armed.delete(key);
    btn.classList.remove('danger');
    if (btn.dataset.wasIcon) btn.classList.add('icon');
    btn.innerHTML = old;
  }, 4000));
}

// ---------- app-wide state ----------
let info = null;

function applyTheme() {
  const t = info?.settings.theme || 'system';
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t;
}

async function loadInfo() {
  try {
    info = await api('GET', '/api/info');
  } catch {
    return;
  }
  applyTheme();
  $('#side-foot').textContent = `Version ${info.version}`;
  document.querySelectorAll('#nav a[data-tool]').forEach(a => { a.hidden = !info.settings.tools[a.dataset.tool]; });
  renderUpdateBanner();
}

function renderUpdateBanner() {
  const el = $('#update-banner');
  const u = info?.update, offer = info?.update_offer;
  if (u?.downloading != null) {
    el.innerHTML = `<div class="banner">${icon('download')}<div class="grow"><b>Downloading the update…</b>
      <div class="meter"><i style="width:${Math.round(u.downloading * 100)}%"></i></div></div></div>`;
    return;
  }
  if (!offer) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="banner">${icon('download')}
    <div class="grow"><b>Version ${esc(offer.version)} is available.</b> <span class="muted">You have ${esc(info.version)}.</span>
    <a href="${esc(offer.page)}" target="_blank" rel="noopener">What's new</a></div>
    <div class="actions">
      <button class="btn ghost" data-act="update-skip">Skip this version</button>
      <button class="btn" data-act="update-later">Not now</button>
      <button class="btn primary" data-act="update-install">Update</button>
    </div></div>`;
}

$('#update-banner').addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  try {
    if (act === 'update-install') {
      b.disabled = true;
      toast('Downloading the update…');
      const poll = setInterval(loadInfo, 700);
      try { await api('POST', '/api/update/install'); } finally { clearInterval(poll); }
      toast('Installing. Simple PC Tools will restart by itself.');
    } else if (act === 'update-later') {
      await api('POST', '/api/update/later');
      toast("OK. We'll ask again in a few days.");
    } else if (act === 'update-skip') {
      await api('POST', '/api/update/skip');
      toast("We won't ask about this version again.");
    }
  } catch (err) {
    toast(err.message);
    b.disabled = false;
  }
  if (DEMO && act !== 'update-install') { info.update_offer = null; renderUpdateBanner(); return; }
  loadInfo();
});

// ---------- routing ----------
const PAGES = ['apps', 'disk', 'settings'];
function route() {
  let page = location.hash.slice(1);
  if (!PAGES.includes(page) || (info && page !== 'settings' && !info.settings.tools[page])) {
    page = PAGES.find(p => p === 'settings' || !info || info.settings.tools[p]);
  }
  for (const p of PAGES) $(`#page-${p}`).hidden = p !== page;
  document.querySelectorAll('#nav a').forEach(a => {
    if (a.getAttribute('href') === `#${page}`) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  ({ apps: showApps, disk: showDisk, settings: showSettings })[page]();
}
window.addEventListener('hashchange', route);

// =====================================================================
// Apps
// =====================================================================
const STATES = {
  healthy:  { label: 'Running', attn: false },
  starting: { label: 'Starting', attn: false, live: true },
  acting:   { label: 'Working…', attn: false, live: true },
  failing:  { label: 'Not responding', attn: true },
  gave_up:  { label: 'Gave up', attn: true },
  held:     { label: 'Left alone', attn: true },
  stopped:  { label: 'Not running', attn: false },
  unknown:  { label: 'Not checked yet', attn: false },
};
const stateOf = app => app.status?.acting ? 'acting' : (app.status?.health || 'unknown');

let apps = null, appsShape = '';
const openEvents = new Set();

function appNote(app, st) {
  const s = app.status || {};
  if (st === 'gave_up') return `Restarted ${s.restarts?.length || 0} times in the last hour, so it stopped trying. Restart it once you've fixed the problem.`;
  if (st === 'held') return `Left alone: ${esc(s.hold_reason)}`;
  if (st === 'failing' && app.keep_running) return 'It will be restarted if the next check fails too.';
  if (st === 'stopped' && !app.keep_running) return 'Turn on "Keep running" to have it restarted automatically.';
  if (st === 'unknown' && app.status?.last_check && !(s.probes || []).length) return 'Started at sign-in. Add a check under Advanced to watch it.';
  return '';
}

function renderApps() {
  const el = $('#page-apps');
  const list = apps?.apps || [];
  const bad = list.filter(a => STATES[stateOf(a)].attn).length;
  const navCount = $('#nav-apps-count');
  navCount.hidden = !bad;
  navCount.textContent = bad;
  if (!apps) return;

  const shape = JSON.stringify([apps.paused, apps.check_every_secs, list.map(a => [a.id, a.name, a.program, a.args, a.start_at_login, a.keep_running, stateOf(a), a.status?.hold_reason, (a.status?.probes || []).map(p => [p.ok, p.detail]), a.status?.events?.[0]?.at, openEvents.has(a.id)])]);
  if (shape === appsShape && el.firstChild) { tickApps(); return; }
  appsShape = shape;

  const counts = {};
  list.forEach(a => { const s = stateOf(a); counts[s] = (counts[s] || 0) + 1; });
  const summary = list.length ? `<div class="summary">
      ${['healthy', 'starting', 'acting', 'failing', 'gave_up', 'held', 'stopped', 'unknown'].filter(s => counts[s]).map(s =>
        `<span class="dot st-${s}"><span class="lamp"></span><b>${counts[s]}</b> ${STATES[s].label.toLowerCase()}</span>`).join('')}
      <span class="faint" id="next-check"></span></div>` : '';

  el.innerHTML = `
    <div class="head"><div class="titles"><h1>Apps</h1>
      <p class="sub">Start the programs you choose when you sign in, and restart them if they stop.</p></div>
      <div class="actions">
        ${list.length ? `<button class="btn" id="check-now">${icon('refresh')}Check now</button>` : ''}
        <button class="btn primary" id="add-app">${icon('plus')}Add app</button>
      </div></div>
    ${apps.paused ? `<div class="banner warn">${icon('pause')}<div class="grow"><b>Paused.</b> Apps are still checked, but nothing is started or restarted.</div>
      <button class="btn" id="resume">Resume</button></div>` : ''}
    ${summary}
    ${list.length ? `<div class="card">${list.map(appRow).join('')}</div>` : `
      <div class="card empty">${icon('apps', 'art')}<h2>No apps yet</h2>
        <p>Add a program and Simple PC Tools will start it when you sign in, and bring it back if it closes or stops answering.</p>
        <button class="btn primary" id="add-app-empty">${icon('plus')}Add your first app</button></div>`}
    ${list.length ? `<details class="adv after-list"><summary>${icon('chevron')}Manager settings</summary><div class="inner">
      <label class="switch"><input type="checkbox" id="pause"${apps.paused ? ' checked' : ''}><span class="track"></span>Pause: check apps, but don't start or restart anything</label>
      <label class="field"><span>Check every (seconds)</span><input type="number" min="5" max="86400" id="check-every" value="${apps.check_every_secs}">
      <small>While an app is starting or failing, it's checked every 15 seconds.</small></label></div></details>` : ''}`;
  tickApps();
}

function appRow(app) {
  const st = stateOf(app), S = STATES[st], s = app.status || {};
  const probes = s.probes || [];
  const showProbes = probes.length > 1 || probes.some(p => !p.ok);
  const note = appNote(app, st);
  const id = esc(app.id);
  return `<div class="app st-${st}${S.attn ? ' attn' : ''}" data-id="${id}">
    <span class="lamp${S.live ? ' live' : ''}" title="${S.label}"></span>
    <div class="app-main">
      <div class="app-name"><b>${esc(app.name)}</b><span class="pill">${S.label}</span></div>
      <div class="app-prog data" title="${esc(app.program)} ${esc(app.args)}">${esc(app.program)} ${esc(app.args)}</div>
      ${showProbes ? `<div class="probes">${probes.map(p => `<span class="probe ${p.ok ? 'ok' : 'bad'}" title="${esc(p.detail)}">${icon(p.ok ? 'check' : 'x')}${esc(p.detail)}</span>`).join('')}</div>` : ''}
      ${note ? `<div class="app-note">${note}</div>` : ''}
    </div>
    <div class="app-ctrl">
      <div class="switches">
        <label class="switch" title="Start it when you sign in"><input type="checkbox" data-toggle="start_at_login" id="sl-${id}"${app.start_at_login ? ' checked' : ''}><span class="track"></span>Start at sign-in</label>
        <label class="switch" title="Restart it when it stops or fails a check"><input type="checkbox" data-toggle="keep_running" id="kr-${id}"${app.keep_running ? ' checked' : ''}><span class="track"></span>Keep running</label>
      </div>
      <div class="buttons">
        <button class="btn" data-app-act="restart" data-confirm="restart-${id}" title="Restart now">${icon('restart')}Restart</button>
        <button class="btn icon ghost" data-app-act="stop" data-confirm="stop-${id}" data-was-icon="1" title="Stop it now" aria-label="Stop">${icon('stop')}</button>
        <button class="btn icon ghost" data-app-act="events" title="Activity" aria-label="Activity" aria-expanded="${openEvents.has(app.id)}">${icon('list')}</button>
        <button class="btn icon ghost" data-app-act="edit" title="Edit" aria-label="Edit">${icon('edit')}</button>
      </div>
    </div>
    ${openEvents.has(app.id) ? `<ul class="events">${(s.events || []).map(ev => `<li><time>${clock(ev.at)}</time><span>${esc(ev.message)}</span></li>`).join('') || '<li class="faint">Nothing has happened yet.</li>'}</ul>` : ''}
  </div>`;
}

function tickApps() {
  const n = $('#next-check');
  if (n && apps?.next_check) {
    const s = apps.next_check - now();
    n.textContent = s > 0 ? `Next check in ${s}s` : 'Checking…';
  }
}

async function loadApps() {
  try {
    apps = await api('GET', '/api/apps');
  } catch (e) {
    $('#page-apps').innerHTML = `<div class="banner bad">${icon('alert')}<div class="grow">${esc(e.message)}</div></div>`;
    appsShape = '';
    return;
  }
  if (!$('#page-apps').hidden) renderApps();
}

function showApps() { renderApps(); loadApps(); }

async function run(fn) {
  try { await fn(); } catch (err) { toast(err.message); }
}

$('#page-apps').addEventListener('click', e => run(async () => {
  const t = e.target;
  if (t.closest('#add-app, #add-app-empty')) return openEditor(null);
  if (t.closest('#check-now')) { await api('POST', '/api/apps/check'); toast('Checking all apps now.'); setTimeout(loadApps, 1500); return; }
  if (t.closest('#resume')) { await api('PATCH', '/api/apps/settings', { paused: false }); toast('Resumed.'); return loadApps(); }
  const b = t.closest('[data-app-act]');
  if (!b) return;
  const app = apps.apps.find(a => a.id === b.closest('.app').dataset.id);
  const act = b.dataset.appAct;
  if (act === 'edit') return openEditor(app);
  if (act === 'events') {
    openEvents.has(app.id) ? openEvents.delete(app.id) : openEvents.add(app.id);
    return renderApps();
  }
  if (act === 'restart') return confirmClick(b, 'Click again to restart', () => run(async () => {
    await api('POST', `/api/apps/${encodeURIComponent(app.id)}/restart`);
    toast(`Restarting ${app.name}…`);
    setTimeout(loadApps, 800);
  }));
  if (act === 'stop') return confirmClick(b, 'Click again to stop', () => run(async () => {
    await api('POST', `/api/apps/${encodeURIComponent(app.id)}/stop`);
    toast(app.keep_running ? `Stopped ${app.name}. "Keep running" will start it again; turn that off to keep it stopped.` : `Stopped ${app.name}.`);
    setTimeout(loadApps, 800);
  }));
}));

$('#page-apps').addEventListener('change', e => run(async () => {
  const t = e.target;
  try {
    if (t.dataset.toggle) {
      const id = t.closest('.app').dataset.id;
      const name = apps.apps.find(a => a.id === id).name;
      await api('PATCH', `/api/apps/${encodeURIComponent(id)}`, { [t.dataset.toggle]: t.checked });
      const what = t.dataset.toggle === 'keep_running' ? 'Keep running' : 'Start at sign-in';
      toast(`${what} is ${t.checked ? 'on' : 'off'} for ${name}.`);
    } else if (t.id === 'pause') {
      await api('PATCH', '/api/apps/settings', { paused: t.checked });
      toast(t.checked ? 'Paused. Nothing will be started or restarted.' : 'Resumed.');
    } else if (t.id === 'check-every') {
      await api('PATCH', '/api/apps/settings', { check_every_secs: Number(t.value) });
      toast(`Apps are checked every ${t.value} seconds.`);
    }
  } finally {
    appsShape = '';
    loadApps();
  }
}));

// ---------- app editor ----------
const CHECK_KINDS = {
  http: { label: 'URL answers', fields: [['url', 'http://localhost:8080/health']] },
  tcp: { label: 'Port is open', fields: [['port', '8080'], ['host', '127.0.0.1']] },
  process: { label: 'Process is running', fields: [['name', 'server.exe']] },
  file_exists: { label: 'File exists', fields: [['path', '%LOCALAPPDATA%\\app\\paused.flag']] },
};

function checkRows(list) {
  return list.map(c => {
    const k = CHECK_KINDS[c.kind] ? c.kind : 'http';
    const fields = CHECK_KINDS[k].fields.map(([f, ph]) =>
      `<input class="input" data-f="${f}" placeholder="${esc(ph)}" value="${esc(c[f] ?? '')}" aria-label="${f}" spellcheck="false">`).join('');
    return `<div class="check-row">
      <select class="input" data-f="kind" aria-label="Check type">${Object.entries(CHECK_KINDS).map(([v, d]) => `<option value="${v}"${v === k ? ' selected' : ''}>${d.label}</option>`).join('')}</select>
      <div class="input-row">${fields}</div>
      <button type="button" class="btn icon ghost" data-remove aria-label="Remove">${icon('x')}</button></div>`;
  }).join('');
}

function readChecks(container) {
  return [...container.querySelectorAll('.check-row')].map(row => {
    const c = { kind: row.querySelector('[data-f=kind]').value };
    row.querySelectorAll('input[data-f]').forEach(i => {
      const v = i.value.trim();
      if (v) c[i.dataset.f] = i.dataset.f === 'port' ? Number(v) : v;
    });
    return c;
  });
}

          <div class="checks" id="ed-checks">${checkRows(adv.checks)}</div>
          <div><button type="button" class="btn" data-add="ed-checks">${icon('plus')}Add check</button></div></div>
        <div class="field"><span>Leave it alone when</span>
          <small>If any of these pass, it isn't restarted even when it looks down (it's busy, or you stopped it on purpose).</small>
          <div class="checks" id="ed-holds">${checkRows(adv.hold_if)}</div>

        <label class="switch"><input type="checkbox" id="ed-hide"${adv.hide_window ? ' checked' : ''}><span class="track"></span>Hide the console window</label>

    const t = e.target;

    if (t.closest('[data-remove]')) return t.closest('.check-row').remove();
    const add = t.closest('[data-add]');
    if (add) return $(`#${add.dataset.add}`).insertAdjacentHTML('beforeend', checkRows([{ kind: 'http' }]));

      return;

    const del = t.closest('#ed-delete');
    if (del) return confirmClick(del, 'Click again to remove', () => run(async () => {
      await api('DELETE', `/api/apps/${encodeURIComponent(a.id)}`);
      dlg.close();
      toast(`Removed ${a.name}. If it's running, it keeps running until you close it.`);
      loadApps();
    }));
  }));
  form.addEventListener('change', e => {
    const sel = e.target.closest('select[data-f=kind]');
    if (sel) sel.closest('.check-row').outerHTML = checkRows([{ kind: sel.value }]);
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    let steps = { start: [], stop: [] };
    const raw = $('#ed-custom').value.trim();
    if (raw) {
      try { steps = Object.assign(steps, JSON.parse(raw)); }
      catch { return fail("The custom steps aren't valid JSON."); }
    }
    const pname = $('#ed-pname').value.trim(), pcmd = $('#ed-pcmd').value.trim();
    const body = {
      id: a.id || '',
      name: $('#ed-name').value.trim(),
      program: $('#ed-program').value.trim().replace(/^"|"$/g, ''),
      args: $('#ed-args').value.trim(),
      folder: $('#ed-folder').value.trim(),
      start_at_login: $('#ed-sl').checked,
      keep_running: $('#ed-kr').checked,
      advanced: {
        process: pname ? { name: pname, cmdline_contains: pcmd || undefined } : null,
        skip_process_check: $('#ed-skip').checked,
        checks: readChecks($('#ed-checks')),
        hold_if: readChecks($('#ed-holds')),
        end_before_restart: $('#ed-end').checked,
        run_as_admin: $('#ed-admin').checked,
        hide_window: $('#ed-hide').checked,
        failures_before_restart: Number($('#ed-fails').value) || 1,
        startup_grace_secs: Number($('#ed-grace').value) || 0,
        max_restarts_per_hour: Number($('#ed-max').value) || 1,
        custom_start: steps.start || [],
        custom_stop: steps.stop || [],
      },
    };
    if (!body.name && body.program) body.name = body.program.split(/[\\/]/).pop().replace(/\.[^.]+$/, '');
    try {
      if (isNew) await api('POST', '/api/apps', body);
      else await api('PUT', `/api/apps/${encodeURIComponent(a.id)}`, body);
    } catch (err) {
      return fail(err.message);
    }
    dlg.close();
    toast(isNew ? `Added ${body.name}.` : `Saved ${body.name}.`);
    appsShape = '';
    loadApps();
  });
  dlg.showModal();
  (isNew ? $('#ed-program') : $('#ed-name')).focus();
}

let drives = null, scan = null, listing = null, diskTimer = null;

function renderDisk() {
  const el = $('#page-disk');
  const scanning = scan?.state === 'scanning';
  el.innerHTML = `
    <div class="head"><div class="titles"><h1>Disk usage</h1>
      <p class="sub">See which folders take up the most space. Nothing is changed or deleted here.</p></div>
      <div class="actions"><button class="btn" id="scan-folder"${scanning ? ' disabled' : ''}>${icon('folder')}Scan a folder…</button></div></div>
    ${drives && !drives.fast ? `<div class="banner warn">${icon('alert')}<div class="grow">Running without administrator rights, so scans go through folders one by one instead of reading the drive's file table. They work, just more slowly.</div></div>` : ''}
    <div class="drives">${(drives?.drives || []).map(d => {
      const used = d.total - d.free, pct = d.total ? used / d.total : 0;
      const name = d.root.replace(/\\$/, '');
      return `<div class="card drive"><div class="top"><b>${esc(d.label ? `${d.label} (${name})` : name)}</b><span class="faint">${esc(d.file_system)}</span></div>
        <div class="meter${pct > .9 ? ' full' : ''}"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
        <div class="muted">${bytes(d.free)} free of ${bytes(d.total)}</div>
        <div><button class="btn${scan?.state === 'done' && scan.path === d.root ? '' : ' primary'}" data-scan="${esc(d.root)}"${scanning ? ' disabled' : ''}>Scan ${esc(name)}</button></div></div>`;
    }).join('')}</div>
    <div id="scan-area" data-state="${esc(scan?.state || 'idle')}">${scanArea()}</div>`;
}

function scanArea() {
  if (!scan || scan.state === 'idle') return `<div class="card empty">${icon('disk', 'art')}<h2>Pick a drive to scan</h2><p>You'll see its folders sorted by size, biggest first. Click a folder to look inside.</p></div>`;
  if (scan.state === 'scanning') return `<div class="card scan-state"><span class="spinner"></span>
    <div class="grow"><b>Scanning ${esc(scan.path)}</b><div class="muted">${esc(scan.phase || 'Starting')} · ${count(scan.files)} files · ${bytes(scan.bytes)} · ${Number(scan.elapsed).toFixed(0)}s</div></div>
    <button class="btn" id="scan-cancel">Cancel</button></div>`;
  if (scan.state === 'error') return `<div class="banner bad">${icon('alert')}<div class="grow"><b>The scan didn't finish.</b> ${esc(scan.error)}</div></div>`;
  if (!listing) return '';
  const how = scan.method === 'file_table' ? "read the drive's file table" : 'went through every folder';
  const last = listing.crumbs.length - 1;
  return `<div class="hint scan-note">Scanned ${esc(scan.path)}: ${count(scan.files)} files in ${Number(scan.elapsed).toFixed(1)} seconds (${how}).
      ${scan.skipped ? `${count(scan.skipped)} folders couldn't be read (no permission).` : ''}</div>
    <div class="card">
      <div class="crumbs">${listing.crumbs.map((c, i) => `${i ? icon('chevron') : ''}<button data-node="${c.id}"${i === last ? ' aria-current="page"' : ''}>${esc(c.name)}</button>`).join('')}
        <span class="total">${bytes(listing.node.size)} · ${count(listing.node.files)} files</span></div>
      <div class="table-wrap"><table class="items">
        <colgroup><col><col class="c-share"><col class="c-size"><col class="c-files"><col class="c-act"></colgroup>
        <thead><tr><th>Name</th><th>Share</th><th class="num">Size</th><th class="num">Files</th><th><span hidden>Actions</span></th></tr></thead>
        <tbody>${listing.children.map(c => `<tr>
          <td><button class="item-name${c.is_dir ? ' dir' : ''}" ${c.is_dir && c.has_children ? `data-node="${c.id}"` : 'tabindex="-1"'} title="${esc(c.name)}">${icon(c.is_dir ? 'folder' : 'file')}<span>${esc(c.name)}</span></button></td>
          <td><div class="share"><div class="meter"><i style="width:${(c.share * 100).toFixed(1)}%"></i></div><span>${(c.share * 100).toFixed(c.share < .1 ? 1 : 0)}%</span></div></td>
          <td class="num">${bytes(c.size)}</td>
          <td class="num">${c.is_dir ? count(c.files) : ''}</td>
          <td><button class="btn icon ghost" data-reveal="${c.id}" title="Show in File Explorer" aria-label="Show in File Explorer">${icon('open')}</button></td></tr>`).join('')}
          ${listing.other ? `<tr><td class="faint" colspan="2">${count(listing.other.count)} smaller items</td><td class="num">${bytes(listing.other.size)}</td><td></td><td></td></tr>` : ''}
          ${!listing.children.length ? '<tr><td colspan="5" class="faint">This folder is empty.</td></tr>' : ''}
        </tbody></table></div></div>`;
}

async function pollScan() {
  clearTimeout(diskTimer);
  try {
    scan = await api('GET', '/api/disk/status');
    if (scan.state === 'done' && (!listing || listing.scanPath !== scan.path)) await openNode(null, false);
  } catch (e) {
    return toast(e.message);
  }
  if ($('#page-disk').hidden) return;
  const area = $('#scan-area');
  if (!area || area.dataset.state !== scan.state) renderDisk();
  else area.innerHTML = scanArea();
  if (scan.state === 'scanning') diskTimer = setTimeout(pollScan, 400);
}

async function openNode(id, render = true) {
  try {
    listing = await api('GET', `/api/disk/list${id == null ? '' : `?id=${id}`}`);
    listing.scanPath = scan.path;
  } catch (e) {
    return toast(e.message);
  }
  if (render) $('#scan-area').innerHTML = scanArea();
}

async function startScan(path) {
  await api('POST', '/api/disk/scan', { path });
  listing = null;
  pollScan();
}

async function showDisk() {
  renderDisk();
  if (!drives) {
    try { drives = await api('GET', '/api/disk/drives'); } catch (e) { toast(e.message); }
    renderDisk();
  }
  pollScan();
}

$('#page-disk').addEventListener('click', e => run(async () => {
  const t = e.target;
  const d = t.closest('[data-scan]');
  if (d) return startScan(d.dataset.scan);
  if (t.closest('#scan-folder')) {
    const r = await api('POST', '/api/disk/pick');
    if (r?.path) await startScan(r.path);
    return;
  }
  if (t.closest('#scan-cancel')) { await api('POST', '/api/disk/cancel'); return toast('Scan cancelled.'); }
  const r = t.closest('[data-reveal]');
  if (r) return api('POST', '/api/disk/reveal', { id: Number(r.dataset.reveal) });
  const n = t.closest('[data-node]');
  if (n && !n.hasAttribute('aria-current')) return openNode(Number(n.dataset.node));
}));

function showSettings() { renderSettings(); loadInfo().then(renderSettings); }

$('#page-settings').addEventListener('change', async e => {
  const t = e.target;
  const map = {
    'set-autostart': ['start_with_windows', on => on ? 'Simple PC Tools will start with Windows.' : "Simple PC Tools won't start with Windows."],
    'set-apps': ['apps', on => on ? 'The Apps tool is on.' : 'The Apps tool is off. Nothing is checked or restarted.'],
    'set-disk': ['disk', on => on ? 'The Disk usage tool is on.' : 'The Disk usage tool is off.'],
    'set-updates': ['check_updates', on => on ? "We'll let you know when there's a new version." : "Update checks are off. We won't ask again."],
  };
  const m = map[t.id];
  if (!m) return;
  try {
    await api('PATCH', '/api/settings', { [m[0]]: t.checked });
    toast(m[1](t.checked));
    if (DEMO) {
      if (m[0] in info.settings.tools) info.settings.tools[m[0]] = t.checked;
      if (m[0] === 'check_updates') info.settings.updates.check = t.checked;
      if (m[0] === 'start_with_windows') info.start_with_windows = t.checked;
      document.querySelectorAll('#nav a[data-tool]').forEach(a => { a.hidden = !info.settings.tools[a.dataset.tool]; });
      return;
    }
  } catch (err) {
    toast(err.message);
    t.checked = !t.checked;
  }
  await loadInfo();
  renderSettings();
});

$('#page-settings').addEventListener('click', e => run(async () => {

    await loadInfo();
    return renderSettings();

  if (e.target.closest('#check-updates')) {
    await api('POST', '/api/update/check').catch(err => toast(err.message));
    if (!DEMO) await loadInfo();
    renderSettings();
  }
}));

        status: { health: 'held', acting: false, last_check: t0, hold_reason: 'C:\\Tools\\backup\\paused.flag exists', probes: [{ ok: false, detail: 'agent.exe not running' }], restarts: [], events: [] } },
      { id: 'dev-db', name: 'Dev database', program: 'C:\\Dev\\db\\start.bat', args: '', folder: '', start_at_login: false, keep_running: true,
        advanced: { skip_process_check: true, checks: [{ kind: 'tcp', host: '127.0.0.1', port: 5432, timeout_secs: 3 }] },
        status: { health: 'gave_up', acting: false, last_check: t0, probes: [{ ok: false, detail: '127.0.0.1:5432 refused' }], restarts: [t0 - 3000, t0 - 2000, t0 - 1000, t0 - 600, t0 - 300], events: [] } },
      { id: 'chat', name: 'Chat', program: 'C:\\Users\\you\\AppData\\Local\\Chat\\chat.exe', args: '--minimized', folder: '', start_at_login: true, keep_running: false, advanced: {}, watched_process: 'chat.exe',
        status: { health: 'stopped', acting: false, last_check: t0, probes: [{ ok: false, detail: 'chat.exe not running' }], restarts: [], events: [] } },

  ] },
};
// Demo states, for the design tests: health: 'healthy' 'failing' 'starting' 'held' 'gave_up' 'stopped'.
const demoTree = (() => {
  const nodes = [];
  const add = (name, parent, size, files, dir = true) => { nodes.push({ id: nodes.length, name, parent, size, files, is_dir: dir }); return nodes.length - 1; };
  const root = add('C:\\', 0, 813e9, 1840211);
  const users = add('Users', root, 402e9, 712004);
  add('Windows', root, 38e9, 310221);
  add('Program Files', root, 61e9, 220114);
  add('Program Files (x86)', root, 19e9, 90112);
  add('ProgramData', root, 14e9, 120443);
  add('pagefile.sys', root, 17e9, 1, false);
  add('hiberfil.sys', root, 6.4e9, 1, false);
  add('Games', root, 255e9, 377315);
  const you = add('you', users, 398e9, 700001);
  add('Public', users, 4e9, 12003);
  add('Videos', you, 190e9, 1203);
  add('AppData', you, 96e9, 510221);
  add('Downloads', you, 61e9, 3420);
  add('Documents', you, 33e9, 150021);
  add('Pictures', you, 18e9, 36100);
  add('big-installer.iso', you, 4.7e9, 1, false);
  return nodes;
})();
const demoKids = id => demoTree.filter(n => n.parent === id && n.id !== id).sort((a, b) => b.size - a.size);
let demoScan = { state: 'idle' };

async function demoApi(method, path, body) {
  await new Promise(r => setTimeout(r, 120));
  const p = path.replace(/\?.*/, '');
  if (p === '/api/info') return structuredClone(demo.info);
  if (p === '/api/apps' && method === 'GET') return structuredClone({ ...demo.apps, next_check: now() + 60 - ((now() - t0 + 18) % 60) });
  if (p === '/api/apps/pick') return { program: 'C:\\Program Files\\Example\\example.exe', name: 'Example' };
  if (p === '/api/disk/drives') return demo.drives;
  if (p === '/api/disk/scan') { demoScan = { state: 'scanning', path: body.path, files: 0, bytes: 0, phase: 'Reading file table', elapsed: 0, started: Date.now() }; return null; }
  if (p === '/api/disk/status') {
    if (demoScan.state === 'scanning') {
      const t = (Date.now() - demoScan.started) / 1000;
      Object.assign(demoScan, { files: Math.round(t * 420000), bytes: t * 190e9, elapsed: t });
      if (t > 2.2) Object.assign(demoScan, { state: 'done', files: 1840211, bytes: 813e9, elapsed: 4.4, method: 'file_table', skipped: 0 });
    }
    return { ...demoScan };
  }
  if (p === '/api/disk/list') {
    const id = Number(new URLSearchParams(path.split('?')[1] || '').get('id') || 0);
    const node = demoTree[id];
    const crumbs = [];
    for (let n = node; ; n = demoTree[n.parent]) { crumbs.unshift({ id: n.id, name: n.name }); if (n.id === 0) break; }
    const children = demoKids(id).map(c => ({ ...c, share: c.size / node.size, has_children: demoKids(c.id).length > 0, allocated: c.size, dirs: 0, modified: t0 - 86400 }));
    return { node: { ...node, share: 1 }, path: '', crumbs, children, other: id === 0 ? { count: 12, size: 2.1e9 } : null };
  }
  if (p === '/api/disk/pick') return { path: 'C:\\Users\\you\\Downloads' };
  return null; // writes change nothing in the demo
}

(async () => {
  await loadInfo();
  route();
  setInterval(() => { if (!$('#page-apps').hidden) loadApps(); }, 5000);
  setInterval(() => { if (!$('#page-apps').hidden) tickApps(); }, 1000);
  setInterval(loadInfo, 60000);
})();
