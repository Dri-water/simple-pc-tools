[package]
name = "disk-scan"
version = "0.1.0"
edition = "2021"
description = "Fast folder-size scanning for Windows: reads the NTFS file table when it can, walks folders when it can't"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }

[dev-dependencies]
tempfile = "3"
