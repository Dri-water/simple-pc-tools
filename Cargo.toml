[workspace]
members = ["crates/disk-scan"]

[package]
name = "simple-pc-tools"
version = "0.1.0"
edition = "2021"
description = "Small, no-frills tools for your Windows PC: keep apps running, see what fills your disk"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dri-water/simple-pc-tools"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
disk-scan = { path = "crates/disk-scan" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rfd = "0.15"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tao = "0.37.2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26.1"
wry = "0.57.2"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
strip = true
lto = "thin"
